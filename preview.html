<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusSpend - Smart Expense Tracker for College Students</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(75, 85, 99, 0.6);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Format Currency (INR) ---
    const formatCurrency = (amount) => {
      if (isNaN(amount) || amount === null || amount === undefined) return '₹0';
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0,
      }).format(amount);
    };

    // --- Categories Definition ---
    const CATEGORIES = [
      { id: 'Food', label: 'Food & Dining', color: '#f97316', icon: '🍔' },
      { id: 'Travel', label: 'Travel & Transit', color: '#06b6d4', icon: '🚌' },
      { id: 'Water/Utilities', label: 'Water & Utilities', color: '#3b82f6', icon: '💧' },
      { id: 'Shopping', label: 'Shopping & Gear', color: '#a855f7', icon: '🛍️' },
      { id: 'Other', label: 'Other Expenses', color: '#64748b', icon: '📦' },
    ];

    const INCOME_CATEGORIES = [
      { id: 'Allowance', label: 'Pocket Money / Allowance', color: '#10b981', icon: '💰' },
      { id: 'Freelance', label: 'Part-time / Freelance / Tutoring', color: '#059669', icon: '💻' },
      { id: 'Scholarship', label: 'Scholarship / Grant', color: '#34d399', icon: '🎓' },
      { id: 'Other', label: 'Other Income', color: '#6ee7b7', icon: '💵' },
    ];

    // --- Seed Generator ---
    const generateSeedTransactions = () => {
      const today = new Date();
      const formatOffset = (offset) => {
        const d = new Date(today);
        d.setDate(d.getDate() - offset);
        return d.toISOString().split('T')[0];
      };

      return [
        { id: 'tx-1', title: 'Monthly Pocket Money / Stipend', amount: 14000, type: 'income', category: 'Allowance', date: formatOffset(3) },
        { id: 'tx-2', title: 'Weekend Math Tutoring Session', amount: 3500, type: 'income', category: 'Freelance', date: formatOffset(1) },
        { id: 'tx-3', title: 'Campus Canteen Lunch & Thali', amount: 180, type: 'expense', category: 'Food', date: formatOffset(0) },
        { id: 'tx-4', title: 'Monthly Metro SmartCard Recharge', amount: 600, type: 'expense', category: 'Travel', date: formatOffset(2) },
        { id: 'tx-5', title: 'Hostel WiFi & Electricity Share', amount: 450, type: 'expense', category: 'Water/Utilities', date: formatOffset(3) },
        { id: 'tx-6', title: 'Swiggy Dinner with Roommates', amount: 420, type: 'expense', category: 'Food', date: formatOffset(1) },
        { id: 'tx-7', title: 'Textbooks & Spiral Notebooks', amount: 850, type: 'expense', category: 'Shopping', date: formatOffset(4) },
        { id: 'tx-8', title: 'Hostel RO Water Refill Card', amount: 200, type: 'expense', category: 'Water/Utilities', date: formatOffset(2) },
        { id: 'tx-9', title: 'Shared Auto-Rickshaw to Metro', amount: 80, type: 'expense', category: 'Travel', date: formatOffset(0) },
        { id: 'tx-10', title: 'Mobile 5G Data Pack Recharge', amount: 399, type: 'expense', category: 'Other', date: formatOffset(5) }
      ];
    };

    const INITIAL_GOAL = {
      id: 'goal-1',
      title: 'Sony Wireless ANC Headphones',
      targetAmount: 4500,
      currentSaved: 1800,
    };

    // --- Calculations ---
    const getMonthDetails = () => {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const monthName = now.toLocaleString('default', { month: 'long' });
      const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
      const currentDay = now.getDate();
      const daysLeft = Math.max(1, totalDaysInMonth - currentDay + 1);
      const daysPassed = Math.max(1, currentDay);
      return { year, month, monthName, totalDaysInMonth, currentDay, daysLeft, daysPassed };
    };

    const calculateSummary = (transactions) => {
      let totalIncome = 0;
      let totalExpense = 0;
      const todayStr = new Date().toISOString().split('T')[0];
      let todayExpense = 0;

      transactions.forEach((t) => {
        const val = Number(t.amount) || 0;
        if (t.type === 'income') {
          totalIncome += val;
        } else {
          totalExpense += val;
          if (t.date === todayStr) {
            todayExpense += val;
          }
        }
      });

      const netBalance = totalIncome - totalExpense;
      const monthDetails = getMonthDetails();
      const dailyLimit = Math.max(0, netBalance > 0 ? netBalance / monthDetails.daysLeft : 0);
      const savingsRate = totalIncome > 0 ? Math.round(((totalIncome - totalExpense) / totalIncome) * 100) : 0;

      return {
        totalIncome,
        totalExpense,
        netBalance,
        todayExpense,
        dailyLimit: Math.round(dailyLimit),
        savingsRate,
        monthDetails,
      };
    };

    const getCategoryBreakdown = (transactions) => {
      const categoryTotals = {};
      let totalExpenses = 0;
      transactions.forEach((t) => {
        if (t.type === 'expense') {
          const val = Number(t.amount) || 0;
          categoryTotals[t.category] = (categoryTotals[t.category] || 0) + val;
          totalExpenses += val;
        }
      });
      return Object.entries(categoryTotals).map(([name, value]) => ({
        name,
        value,
        percentage: totalExpenses > 0 ? Math.round((value / totalExpenses) * 100) : 0,
      })).sort((a, b) => b.value - a.value);
    };

    const getLast7DaysSpending = (transactions) => {
      const result = [];
      const today = new Date();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const dayName = d.toLocaleDateString('en-US', { weekday: 'short' });
        const formattedDate = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const dayExpense = transactions
          .filter((t) => t.type === 'expense' && t.date === dateStr)
          .reduce((sum, t) => sum + (Number(t.amount) || 0), 0);
        result.push({ dateStr, dayName, formattedDate, spending: dayExpense, isToday: i === 0 });
      }
      return result;
    };

    // --- App Component ---
    function App() {
      // LocalStorage State
      const [theme, setTheme] = useState(() => localStorage.getItem('campussspend_theme') || 'dark');
      const [transactions, setTransactions] = useState(() => {
        try {
          const raw = localStorage.getItem('campussspend_transactions');
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        const seed = generateSeedTransactions();
        localStorage.setItem('campussspend_transactions', JSON.stringify(seed));
        return seed;
      });
      const [goal, setGoal] = useState(() => {
        try {
          const raw = localStorage.getItem('campussspend_goal');
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return INITIAL_GOAL;
      });

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [toast, setToast] = useState(null);

      // What-If Simulator state
      const [simItem, setSimItem] = useState('Headphones');
      const [simPrice, setSimPrice] = useState('2000');

      // Transactions list filters
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterType, setFilterType] = useState('ALL');

      // Goal editing
      const [isEditingGoal, setIsEditingGoal] = useState(false);
      const [editGoalTitle, setEditGoalTitle] = useState(goal.title);
      const [editGoalTarget, setEditGoalTarget] = useState(goal.targetAmount);
      const [editGoalSaved, setEditGoalSaved] = useState(goal.currentSaved);

      // Theme sync
      useEffect(() => {
        localStorage.setItem('campussspend_theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      // State persistence
      useEffect(() => {
        localStorage.setItem('campussspend_transactions', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('campussspend_goal', JSON.stringify(goal));
      }, [goal]);

      const showNotification = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const summary = useMemo(() => calculateSummary(transactions), [transactions]);
      const categoryBreakdown = useMemo(() => getCategoryBreakdown(transactions), [transactions]);
      const last7Days = useMemo(() => getLast7DaysSpending(transactions), [transactions]);

      // What-If calculation
      const simPriceNum = parseFloat(simPrice) || 0;
      const simNewBalance = summary.netBalance - simPriceNum;
      const simNewDailyLimit = Math.max(0, Math.round(simNewBalance > 0 ? simNewBalance / summary.monthDetails.daysLeft : 0));
      const simDailyDrop = Math.max(0, summary.dailyLimit - simNewDailyLimit);
      const simDropPercent = summary.dailyLimit > 0 ? Math.round((simDailyDrop / summary.dailyLimit) * 100) : 100;

      // Goal estimate
      const goalRemaining = Math.max(0, goal.targetAmount - goal.currentSaved);
      const goalProgress = Math.min(100, Math.round((goal.currentSaved / goal.targetAmount) * 100));
      const dailySavingsVelocity = Math.max(0, summary.netBalance / summary.monthDetails.daysPassed);
      const daysToGoal = dailySavingsVelocity > 0 ? Math.ceil(goalRemaining / dailySavingsVelocity) : null;

      // AI Advisor insights
      const aiInsights = useMemo(() => {
        const list = [];
        const foodCat = categoryBreakdown.find(c => c.name === 'Food');
        if (foodCat && summary.totalExpense > 0) {
          const ratio = (foodCat.value / summary.totalExpense) * 100;
          if (ratio > 40) {
            list.push({
              id: 'food-alert',
              type: 'warning',
              title: 'High Food & Dining Outlay',
              message: `Food takes up ${Math.round(ratio)}% (${formatCurrency(foodCat.value)}) of your budget! Cooking in the hostel or eating campus mess thalis could save ~₹1,500 this month.`,
              badge: `${Math.round(ratio)}% of Spend`
            });
          }
        }

        if (summary.dailyLimit > 0 && summary.todayExpense > summary.dailyLimit) {
          list.push({
            id: 'daily-breach',
            type: 'danger',
            title: 'Daily Budget Limit Breached',
            message: `You spent ${formatCurrency(summary.todayExpense)} today, which is ${formatCurrency(summary.todayExpense - summary.dailyLimit)} above your recommended limit of ${formatCurrency(summary.dailyLimit)}. Freeze non-essential purchases tomorrow.`,
            badge: 'Daily Overspend'
          });
        } else if (summary.dailyLimit > 0 && summary.todayExpense > 0) {
          list.push({
            id: 'daily-safe',
            type: 'success',
            title: 'Disciplined Spending Today',
            message: `Today's spend (${formatCurrency(summary.todayExpense)}) is safely under your ${formatCurrency(summary.dailyLimit)} daily allowance. Keep this momentum!`,
            badge: 'On Track'
          });
        }

        if (summary.savingsRate >= 30) {
          list.push({
            id: 'savings-good',
            type: 'success',
            title: 'High Savings Velocity!',
            message: `You are saving ${summary.savingsRate}% of your income. Excellent financial discipline for a college student.`,
            badge: `${summary.savingsRate}% Saved`
          });
        }

        list.push({
          id: 'tip-503020',
          type: 'tip',
          title: 'Student 50/30/20 Rule',
          message: 'Allocate 50% for tuition & hostel mess, 30% for campus leisure & tech, and hold 20% in reserve for exams and emergency trips.',
          badge: 'Strategy'
        });

        list.push({
          id: 'tip-student-id',
          type: 'tip',
          title: 'Student ID Discounts',
          message: 'Always use your student college ID card for Spotify Premium (50% off), Apple Education pricing, and Indian Railways student concessions.',
          badge: 'Student Perk'
        });

        return list;
      }, [categoryBreakdown, summary]);

      // Handlers
      const handleAddTx = (tx) => {
        const item = { ...tx, id: 'tx-' + Date.now() };
        setTransactions([item, ...transactions]);
        showNotification(`Added "${item.title}" successfully!`);
      };

      const handleDeleteTx = (id) => {
        setTransactions(transactions.filter(t => t.id !== id));
        showNotification('Transaction removed.');
      };

      const handleResetAll = () => {
        const seed = generateSeedTransactions();
        setTransactions(seed);
        setGoal(INITIAL_GOAL);
        localStorage.setItem('campussspend_transactions', JSON.stringify(seed));
        localStorage.setItem('campussspend_goal', JSON.stringify(INITIAL_GOAL));
        showNotification('Restored 10 sample student transactions!');
      };

      const filteredList = transactions
        .filter(t => {
          const matchSearch = t.title.toLowerCase().includes(searchQuery.toLowerCase());
          const matchCat = filterCategory === 'ALL' || t.category === filterCategory;
          const matchType = filterType === 'ALL' || t.type === filterType;
          return matchSearch && matchCat && matchType;
        })
        .sort((a, b) => new Date(b.date) - new Date(a.date));

      const isOverLimit = summary.dailyLimit > 0 && summary.todayExpense > summary.dailyLimit;
      const todayPercent = summary.dailyLimit > 0 ? Math.min(100, Math.round((summary.todayExpense / summary.dailyLimit) * 100)) : 100;

      // Category colors mapping
      const catColors = {
        Food: '#f97316',
        Travel: '#06b6d4',
        'Water/Utilities': '#3b82f6',
        Shopping: '#a855f7',
        Other: '#64748b',
        Allowance: '#10b981',
        Freelance: '#059669',
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-semibold flex items-center gap-2 border border-slate-700">
              <span>✅</span>
              <span>{toast}</span>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white text-lg shadow-lg shadow-indigo-600/30">
                  💳
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold text-xl tracking-tight bg-gradient-to-r from-indigo-600 via-violet-600 to-pink-500 bg-clip-text text-transparent">
                      CampusSpend
                    </span>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800">
                      AI Powered
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-500 dark:text-slate-400 hidden sm:block">
                    Smart Expense Tracker for College Students
                  </p>
                </div>
              </div>

              {/* Month Pill */}
              <div className="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs font-medium text-slate-700 dark:text-slate-300">
                <span>📅 {summary.monthDetails.monthName} {summary.monthDetails.year}</span>
                <span className="w-1 h-1 rounded-full bg-slate-400"></span>
                <span className="text-indigo-600 dark:text-indigo-400 font-semibold">{summary.monthDetails.daysLeft} days remaining</span>
              </div>

              {/* Actions */}
              <div className="flex items-center gap-2 sm:gap-3">
                <button
                  onClick={handleResetAll}
                  className="px-2.5 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors flex items-center gap-1"
                  title="Reset Sample Data"
                >
                  <span>🔄</span>
                  <span className="hidden lg:inline">Reset Demo</span>
                </button>

                <button
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors"
                  title="Toggle Theme"
                >
                  {theme === 'dark' ? '☀️' : '🌙'}
                </button>

                <button
                  onClick={() => setIsModalOpen(true)}
                  className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs sm:text-sm font-semibold shadow-md shadow-indigo-600/25 active:scale-95 transition-all"
                >
                  <span>➕</span>
                  <span>Add Transaction</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-6 sm:space-y-8">

            {/* 1. Dynamic Daily Limit Banner */}
            <div className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-900 via-indigo-950 to-slate-950 p-6 sm:p-8 text-white shadow-xl shadow-indigo-950/40 border border-indigo-800/40">
              <div className="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                <div>
                  <div className="flex items-center gap-2 mb-2">
                    <span className="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-400/20">
                      ⚡ Dynamic Daily Spending Limit
                    </span>
                    <span className="px-2.5 py-1 rounded-full text-xs bg-slate-800/80 text-slate-300 border border-slate-700/60">
                      {summary.monthDetails.daysLeft} days left in {summary.monthDetails.monthName}
                    </span>
                  </div>
                  <div className="flex items-baseline gap-3">
                    <span className="text-4xl sm:text-5xl font-black font-mono tracking-tight text-white">
                      {formatCurrency(summary.dailyLimit)}
                    </span>
                    <span className="text-sm font-semibold uppercase text-indigo-200">/ day safe cap</span>
                  </div>
                  <p className="mt-1 text-xs text-indigo-200/80">
                    Formula: Remaining Balance ({formatCurrency(summary.netBalance)}) ÷ {summary.monthDetails.daysLeft} Days Left
                  </p>
                </div>

                <div className="w-full lg:w-96 bg-white/5 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-white/10 flex flex-col gap-3">
                  <div className="flex items-center justify-between text-xs sm:text-sm">
                    <span className="text-indigo-200 font-medium">Today's Total Spend:</span>
                    <span className="font-mono font-bold text-white">{formatCurrency(summary.todayExpense)}</span>
                  </div>

                  <div className="space-y-1">
                    <div className="w-full bg-slate-800/80 rounded-full h-2.5 overflow-hidden p-0.5 border border-slate-700/50">
                      <div
                        className={`h-full rounded-full transition-all duration-500 ${isOverLimit ? 'bg-rose-500' : todayPercent > 80 ? 'bg-amber-400' : 'bg-emerald-400'}`}
                        style={{ width: `${todayPercent}%` }}
                      />
                    </div>
                    <div className="flex justify-between text-[11px] text-slate-300">
                      <span>{todayPercent}% of daily limit</span>
                      <span>{isOverLimit ? `Exceeded by ${formatCurrency(summary.todayExpense - summary.dailyLimit)}` : `${formatCurrency(Math.max(0, summary.dailyLimit - summary.todayExpense))} left today`}</span>
                    </div>
                  </div>

                  <div className="pt-1">
                    {isOverLimit ? (
                      <div className="p-2 rounded-xl bg-rose-500/20 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-1.5">
                        <span>⚠️</span>
                        <span>Daily cap exceeded! Cut discretionary spend tomorrow.</span>
                      </div>
                    ) : (
                      <div className="p-2 rounded-xl bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 text-xs flex items-center gap-1.5">
                        <span>✅</span>
                        <span>Spending pace is healthy for the remaining {summary.monthDetails.daysLeft} days.</span>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            {/* 2. Key Balance Indicators */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <div className="flex items-center justify-between text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">
                  <span>Total Income</span>
                  <span className="text-emerald-500 text-base">↙️</span>
                </div>
                <div className="text-2xl sm:text-3xl font-bold font-mono text-slate-900 dark:text-white mt-2">
                  {formatCurrency(summary.totalIncome)}
                </div>
                <span className="text-[11px] text-emerald-600 dark:text-emerald-400 font-medium">Stipend, tutoring, freelance</span>
              </div>

              <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <div className="flex items-center justify-between text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">
                  <span>Total Expense</span>
                  <span className="text-rose-500 text-base">↗️</span>
                </div>
                <div className="text-2xl sm:text-3xl font-bold font-mono text-slate-900 dark:text-white mt-2">
                  {formatCurrency(summary.totalExpense)}
                </div>
                <span className="text-[11px] text-rose-600 dark:text-rose-400 font-medium">Food, travel, utilities, shopping</span>
              </div>

              <div className="bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 shadow-sm">
                <div className="flex items-center justify-between text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">
                  <span>Net Balance</span>

                        <button
                          onClick={() => handleDeleteTx(tx.id)}
                          className="text-slate-400 hover:text-rose-500 p-1 text-xs"
                          title="Delete"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </main>

          {/* Quick Add Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm">
              <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200 dark:border-slate-800 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white">Add Transaction</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-white">✕</button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    const title = formData.get('title').trim();
                    const amount = parseFloat(formData.get('amount'));
                    const type = formData.get('type');
                    const category = formData.get('category');
                    const date = formData.get('date');

                    if (!title) {
                      alert('Please enter a description');
                      return;
                    }
                    if (isNaN(amount) || amount <= 0) {
                      alert('Amount must be positive and greater than ₹0');
                      return;
                    }

                    handleAddTx({ title, amount, type, category, date });
                    setIsModalOpen(false);
                  }}
                  className="space-y-4"
                >
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Type</label>
                    <select name="type" className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs">
                      <option value="expense">Expense</option>
                      <option value="income">Income</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Title / Description</label>
                    <input
                      name="title"
                      type="text"
                      placeholder="e.g. Campus Canteen Lunch"
                      required
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs text-slate-900 dark:text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Amount (₹)</label>
                    <input
                      name="amount"
                      type="number"
                      step="any"
                      min="1"
                      placeholder="250"
                      required
                      className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-mono text-slate-900 dark:text-white"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Category</label>
                      <select name="category" className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs">
                        {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Date</label>
                      <input
                        name="date"
                        type="date"
                        defaultValue={new Date().toISOString().split('T')[0]}
                        className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs text-slate-900 dark:text-white"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-3.5 py-1.5 text-xs text-slate-500">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-md">
                      Save Transaction
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto py-6 border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 text-center text-xs text-slate-500">
            <p>CampusSpend • Smart Expense Tracker for College Students • React + Tailwind CSS + LocalStorage</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
